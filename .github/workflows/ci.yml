name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check all Python scripts (catches syntax errors)
        run: python -m py_compile scripts/*.py
      - name: Validate policy.json is well-formed
        run: python -c "import json; json.load(open('policy.json', encoding='utf-8-sig'))"
      - name: Validate state files are well-formed JSON
        run: |
          python -c "import json; json.load(open('state/published.json', encoding='utf-8-sig'))"
